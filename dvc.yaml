# Reproducible training pipeline. `dvc repro` rebuilds everything from the raw
# CSV (data/Telco-Customer-Churn.csv). Settings come from params.yaml.
# Model artifacts and docs are tracked in git, so their outputs use
# cache: false (DVC records their hashes in dvc.lock without taking them over).
stages:
  validate_data:
    cmd: python ml/training/validate_data.py
    deps:
      - ml/training/validate_data.py
      - ml/data_schema.py
      - data/Telco-Customer-Churn.csv
    params:
      - data
    outs:
      - reports/data_validation.json:
          cache: false

  train:
    cmd: python ml/training/train.py
    deps:
      - ml/training/train.py
      - ml/training/common.py
      - ml/calibration.py
      - ml/linear_model.py
      - ml/tracking.py
      - ml/preprocessing/preprocessing.py
      - models/feature_list.json
      - models/cat_columns.json
      - data/Telco-Customer-Churn.csv
      - reports/data_validation.json
    params:
      - data
      - split
      - models
      - calibration
      - output
    outs:
      - models/catboost_churn.cbm:
          cache: false
      - models/catboost_churn.calibration.json:
          cache: false
      - models/logreg_challenger.json:
          cache: false
      - models/logreg_challenger.calibration.json:
          cache: false
      - models/training_metadata.json:
          cache: false

  evaluate:
    cmd: python ml/training/evaluate.py
    deps:
      - ml/training/evaluate.py
      - ml/training/common.py
      - models/catboost_churn.cbm
      - models/catboost_churn.calibration.json
      - models/logreg_challenger.json
      - data/Telco-Customer-Churn.csv
    params:
      - cv
      - bootstrap
      - models
      - calibration.reliability_bins
      - evaluation
      - slices
    outs:
      - reports/evaluation/model_comparison.md:
          cache: false
      - reports/evaluation/slice_metrics.md:
          cache: false
      - reports/evaluation/reliability_diagram.png:
          cache: false
      - reports/evaluation/evaluation.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false

  threshold_analysis:
    cmd: python ml/training/threshold_analysis.py
    deps:
      - ml/training/threshold_analysis.py
      - models/catboost_churn.cbm
      - models/catboost_churn.calibration.json
      - data/Telco-Customer-Churn.csv
    params:
      - threshold
      - bootstrap
      - calibration
    outs:
      - reports/evaluation/threshold_analysis.json:
          cache: false

  ci_golden:
    # Golden predictions of the shipped model on the synthetic CI sample
    # (tests/ml/test_ci_sample.py pins them).
    cmd: python scripts/ci/make_ci_sample.py --golden
    deps:
      - scripts/ci/make_ci_sample.py
      - data/ci_sample.csv
      - models/catboost_churn.cbm
      - models/catboost_churn.calibration.json
    outs:
      - data/ci_sample_golden.json:
          cache: false

  dataset_report:
    cmd: python ml/training/build_dataset_report.py
    deps:
      - ml/training/build_dataset_report.py
      - ml/training/dataset_registry.py
      - data/dataset_catalog.json
      - data/Telco-Customer-Churn.csv
    outs:
      - data/dataset_report.md
