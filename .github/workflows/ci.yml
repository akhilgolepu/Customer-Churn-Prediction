name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx shap catboost

      - name: Lint backend code
        run: |
          ruff check backend model/training

      - name: Validate Python import/syntax pipeline
        run: |
          python -m compileall backend model/training

      # The served model (model/artifacts/catboost_churn.cbm + its calibration
      # file) is tracked in git, so tests run against the real artifact. (A step
      # that overwrote it with a 5-feature mock model was removed.)

      # Sets PYTHONPATH to the root workspace so cross-folder imports resolve smoothly
      - name: Run backend regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_BACKEND: sqlite
        run: |
          pytest -q backend/tests --maxfail=1 --disable-warnings

      - name: Backend smoke test (SQLite app factory)
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_BACKEND: sqlite
        run: |
          cd backend
          python -c "from app_factory import create_app; app=create_app(); assert len(app.routes) > 0; print('backend_app_ok', len(app.routes))"

      - name: Data pipeline validation (dataset registry report)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python model/training/build_dataset_report.py

      - name: Upload dataset report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset-report
          path: data/dataset_report.md

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend code
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist