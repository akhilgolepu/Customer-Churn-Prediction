name: Security

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    name: Python Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      # Corrected to point to your root-level requirements file
      - name: Dependency vulnerability scan (pip-audit)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

      - name: Static security scan (Bandit)
        run: |
          bandit -r backend -x backend/tests,backend/__pycache__

  node-security:
    name: Node Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Dependency vulnerability scan (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=critical

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
